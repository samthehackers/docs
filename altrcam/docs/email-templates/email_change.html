<h2>Confirm your new AltrCam email</h2>
<p>Follow the link below to confirm changing your AltrCam email from {{ .Email }} to {{ .NewEmail }}.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email_change&next=/settings">Confirm the change</a></p>
<p>The link works once and expires. If you didn't ask for this, don't follow the link, and change your password.</p>
