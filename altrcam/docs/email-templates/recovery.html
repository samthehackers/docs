<h2>Reset your AltrCam password</h2>
<p>We received a request to reset the password for {{ .Email }}. Follow the link below to choose a new one.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password">Choose a new password</a></p>
<p>The link works once and expires. If you didn't ask for this, you can ignore this email: your password has not changed.</p>
