<h2>Confirm your email for AltrCam</h2>
<p>Follow the link below to confirm {{ .Email }} and finish creating your AltrCam account.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next={{ .RedirectTo }}">Confirm my email</a></p>
<p>The link works once and expires. If you didn't create an AltrCam account, you can ignore this email.</p>
